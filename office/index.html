<body>
  <main id="scene" aria-label="Office"><div class="hq-loading" role="status"><span class="hq-loading-label">Building the office</span><span class="hq-loading-track"><i></i></span></div></main>

<div id="fm-daynight" role="group" aria-label="白天 / 夜晚" style="position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(30,32,38,.82);backdrop-filter:blur(8px);font:600 12px Inter,system-ui,sans-serif">
<button data-t="13:00">☀ 白天</button><button data-t="23:00">☾ 夜晚</button><button data-t="auto">⏱ 自动</button></div>
<style>#fm-daynight button{border:0;border-radius:999px;padding:5px 11px;background:transparent;color:#ddd;cursor:pointer;font:inherit}#fm-daynight button[aria-pressed=true]{background:#fff;color:#111}</style>
<script>(function(){var k="fm.time",bar=document.getElementById("fm-daynight");
function set(v){try{localStorage.setItem(k,v)}catch(e){}bar.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===v?"true":"false")});
var d=window.bothq&&bothq.scene&&bothq.scene.daylight;if(d&&d.setTime){d.setTime(v==="auto"?null:v);return true}return false}
var cur="auto";try{cur=localStorage.getItem(k)||"auto"}catch(e){}
bar.addEventListener("click",function(e){var b=e.target.closest("button");if(b){cur=b.dataset.t;set(cur)}});
set(cur);var n=0,iv=setInterval(function(){if(set(cur)||++n>120)clearInterval(iv)},500);})();</script>
